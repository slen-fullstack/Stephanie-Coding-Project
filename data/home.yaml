running:
  title: "Marathon runner"
  images:
    - "/images/marathon-medals.jpg"
    - "/images/marathon-race.jpg"
    - "/images/marathon-finish.jpg"
  paragraphs:
    - "At 14, after a life-changing event, Stephanie began running—and she hasn't stopped since. Over the last six years, she has completed fourteen half marathons and two full marathons across the West Coast, including Vancouver, Seattle, Victoria, and Whistler. Less than 1% of people in the world run a marathon each year, and the average marathoner is in their late thirties or early forties. Stephanie defied those odds before even turning twenty."
    - "Her passion for running extends beyond personal achievement. In 2022, as Student Council President, she organized a school-wide Terry Fox Run to raise funds for cancer research. Each year, she also participates in the SHLF Run, supporting children in need at the Streetfront Program—a community close to her heart."
    - "Stephanie trains under the guidance of Mr. Stokes, a renowned marathon coach who has completed over 150 marathons and has helped countless youth from Vancouver's Downtown Eastside discover the power of perseverance through running."
  quote: "It's about 55,000 strides to finish a marathon. That's 55,000 opportunities to quit. Imagine how much affirmation you get when you don't quit 55,000 times."
  quote_by: "Mr. Stokes, in Impact Magazine"

# Hanging under the string lights.
events:
  title: "Moments"
  items:
    - title: "Simon Fraser University President and Vice-Chancellor's Award Dinner 2024"
      image: "/images/sfu-dinner.jpg"
      text: "\"I had the incredible honor of attending the 2024 Simon Fraser University President and Vice-Chancellor's Award Dinner as an SFU Uggla Family Scholar. A huge thank you to Joy Johnson, SFU's 10th President and Vice-Chancellor, and Erin Morantz, Vice-President of Advancement & Alumni Engagement, for their unwavering support of Uggla Scholars… I am beyond grateful for this experience and the opportunity to represent SFU as an Uggla Family Scholar.\""
      link: { label: "Read the event article", url: "https://www.stephanieslen.com/sfu-president-and-vice-chancellors-award-dinner-2024.html" }
    - title: "Canada's Great Kitchen Party Gala · October 2025"
      image: "/images/gala-fresh-roots.jpg"
      text: "At one of Canada's most distinguished culinary galas — Canada's Great Kitchen Party, celebrated in ten cities and recognized as North America's premier gastronomic event — Stephanie Slen represented Fresh Roots Urban Farm Society, helping raise over $7,500 in support of youth empowerment and community food programs."

# Click a speech bubble to read the endorsement.
endorsements:
  title: "Endorsements"
  intro: "Click on the speech bubbles to read:"
  items:
    - name: "Trevor Stokes"
      role: "Marathon Coach & Department Head – Alternative Programs, Britannia Secondary"
      quote: "Stephanie is the epicenter of our school. Every good thing that occurs is either touched, produced, guided, sponsored, or completed by Stephanie. This is not an exaggeration. She is front and centre every single day. She is hard-wired to do this. She is not doing this to pad an already ridiculous resume. She operates selflessly, with a relentless desire to make this world better."
    - name: "Alexa Pitoulis"
      role: "Executive Director, BC Family Doctors & Former Executive Director of Fresh Roots Urban Farm"
      quote: "Stephanie's tenacity, humility, commitment to justice and to her own personal learning and development is truly inspirational. Her impact on the lives of so many Fresh Roots youth participants cannot be understated. Knowing Stephanie gives me hope for the future. I cannot imagine a more deserving recipient for the Young Woman of Distinction Award."
    - name: "Cynthia Low"
      role: "Executive Director, Britannia Community Centre"
      quote: "The staff, board, and entire community of Britannia Community Services Centre Society (BCSCS) proudly endorse Stephanie Slen. BCSCS operates a 17-acre municipal community hub in East Vancouver, encompassing schools, a public library, an ice arena, an Indigenous Carving Pavilion, a teen centre, a seniors centre, daycares, and a swimming pool, serving thousands of residents each year. Stephanie has been a remarkable leader from a young age, serving on the Britannia Board of Management at just 18 — one of only 12 elected members — where she contributed to youth programming, governance, and community-building initiatives with exceptional vision, maturity, and dedication. Her leadership has strengthened our community and amplified youth voices, and we are honoured to stand behind her as she continues to make a lasting impact for years to come."
    - name: "Annastasia Forst"
      role: "Managing Director, The Writers' Exchange"
      quote: "Stephanie is a highly valued member of our community, her school community, and the neighborhood community. Throughout the years I witnessed her passion for sustainability, community, and working with young people expand beyond school and the Writers' Exchange."

