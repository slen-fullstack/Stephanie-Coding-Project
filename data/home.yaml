hero:
  kicker: "Stephanie Slen's Bulletin Board"
  name: "Stephanie Slen"
  tagline: "At just 21, Stephanie Slen drives bold initiatives in education, equity, and community power—turning grassroots activism into $2.4M+ in scholarships for youth."
