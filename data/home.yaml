    - { value: 14, label: "Half marathons" }
    - { value: 7500, prefix: "$", suffix: "+", label: "Raised at the gala" }
    - { value: 7, label: "Published stories" }

# The floating clouds. Hover (or tap) a cloud to read more.
highlights:
  title: "Awards & philanthropy"
  intro: "Hover over (or tap) a cloud to read more."
  items:
    - title: "Uggla Family Full Ride Scholar"
      date: "Simon Fraser University"
      image: "/images/uggla-scholar.jpg"
      text: "Stephanie Slen is one of ten recipients of the Simon Fraser University Uggla Family Scholarship, a highly prestigious, worldwide award connecting exceptional students from institutions such as the London School of Economics and beyond. This full-ride scholarship supports leaders pursuing academic excellence and community impact."
      more: "Lance Uggla, Vice Chair of General Atlantic, co-founded BeyondNetZero, the firm's first climate growth equity fund supporting innovative companies advancing net-zero solutions. Previously, he founded and led IHS Markit, taking it public in 2014 and orchestrating its $44 billion merger with S&P Global."
      link: { label: "View LinkedIn post", url: "https://www.linkedin.com/posts/stephanieslen_im-so-thrilled-to-be-celebrating-together-activity-7398877671771860992-OIik" }
    - title: "Canucks Trevor Linden Community Spirit Scholar"
      date: "One of four in BC"
      image: "/images/trevor-linden-scholarship.jpg"
      text: "Stephanie Slen is a recipient of the Canucks Trevor Linden Community Spirit Scholarship, a distinguished award granted annually to four graduating students across British Columbia who have demonstrated exceptional leadership, community service, and resilience."
      more: "Trevor Linden is one of the most accomplished figures in Canadian hockey history—a longtime Vancouver Canuck captain, leader of the NHL Players' Association, Olympian, and recipient of numerous awards for on-ice performance and off-ice charity."
    - title: "YWCA Young Women of Distinction, Nominee"
      date: "2025 · All of Metro Vancouver"
      image: "/images/ywca-nominee.jpg"
      text: "Stephanie Slen is a nominee for the 2025 YWCA Young Women of Distinction Award, which recognizes exceptional young women aged 18–25 who demonstrate leadership, maturity, and compassion."
      more: "The award honours those who have made a significant difference in Metro Vancouver through their commitment to a cause or the pursuit of a personal goal, showing perseverance, innovation, and a deep understanding of community issues."
    - title: "Co-Founder, Nurtured Youth Community"
      date: "Founded at 16"
      image: "/images/nurtured-youth.jpg"
      text: "At 16 after attending SHAD Canada at York University, a S.T.E.A.M. Entrepreneur Program on a full scholarship, Stephanie co-founded Nurtured Youth Community in Vancouver, British Columbia with her co-founder Geertika Jeyaganesha in Toronto, supporting kids across Canada with their mental health during COVID-19."
      more: "Six months after it was founded it won a $5,000 grant from OXY Canada as the Face of Today and was featured in a CBC News article."
      link: { label: "Nurtured Youth Community", url: "https://www.nurturedyouthcommunity.com/" }

