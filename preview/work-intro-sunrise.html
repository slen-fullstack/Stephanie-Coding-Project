<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunrise Transition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --sky-top: #10153f; --sky-mid: #1b2563; --ink: #f4f1ff; --muted: #c3c6ec; --yellow: #ffc94a; --teal: #5fe3c0; }
  html, body { margin: 0; height: 100%; background: var(--sky-top); overflow: hidden; font-family: "Fredoka", system-ui, sans-serif; }
  #site { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }

  #intro { position: fixed; inset: 0; z-index: 10; background: radial-gradient(ellipse at 50% 45%, #1f2b6e 0%, var(--sky-mid) 40%, var(--sky-top) 100%); transition: opacity .8s ease, visibility .8s; overflow: hidden; }
  #intro.done { visibility: hidden; }
  /* sunrise wipe: the night is cut away from the bottom up */
  #intro { clip-path: inset(0 0 calc(var(--p, 0) * 100%) 0); }
  .sunrise {
    position: fixed; left: 0; right: 0; z-index: 11; height: 70vh; pointer-events: none;
    bottom: calc(var(--p, 0) * 100% - 35vh); opacity: var(--glow, 0); mix-blend-mode: screen;
    background: linear-gradient(0deg,
      rgba(255, 140, 70, 0) 0%, rgba(255, 150, 80, .35) 18%, rgba(255, 196, 110, .75) 38%,
      rgba(255, 244, 214, .95) 50%, rgba(255, 214, 120, .7) 60%, rgba(255, 170, 90, .3) 78%, rgba(255, 150, 80, 0) 100%);
    filter: blur(6px);
  }
  .sunrise::before { content: ""; position: absolute; left: 50%; top: 50%; width: 46vmax; height: 46vmax; translate: -50% -50%; border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 240, .95) 0%, rgba(255, 220, 140, .6) 25%, rgba(255, 170, 90, .2) 50%, transparent 70%); }
  #intro-stars { position: absolute; inset: 0; width: 100%; height: 100%; }

  .map { position: absolute; inset: 0; transition: transform 1.1s cubic-bezier(.6, 0, .3, 1), opacity 1s ease; transform-origin: 50% 40%; }
  /* stars brighten as the dawn reaches them */
  #intro.leave .map { filter: brightness(1.4); transition: filter 1.2s ease; }

  .lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .lines line { stroke: rgba(255, 233, 168, .6); stroke-width: 1.6; stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(255, 216, 107, .7)); stroke-dasharray: var(--len); stroke-dashoffset: var(--len); }
  .lines line.on { transition: stroke-dashoffset .45s ease; stroke-dashoffset: 0; }

  .node { position: absolute; left: var(--x); top: var(--y); width: 0; height: 0; }
  .node .dot { position: absolute; left: -10px; top: -10px; width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle, #fff 0%, #fff3c4 35%, rgba(255, 201, 74, .6) 60%, transparent 72%); transform: scale(0); }
  /* yellow-white aura around each star */
  .node .dot::before, .node .dot::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; }
  .node .dot::before { inset: -52px; background: radial-gradient(circle, rgba(255, 255, 245, .95) 0%, rgba(255, 244, 190, .7) 14%, rgba(255, 224, 120, .38) 32%, rgba(255, 200, 80, .14) 52%, transparent 70%); animation: aura 2.8s ease-in-out infinite; }
  .node .dot::after { inset: -16px; background: radial-gradient(circle, #fff 0%, rgba(255, 250, 225, .9) 30%, rgba(255, 236, 160, .45) 55%, transparent 75%); filter: blur(1px); }
  @keyframes aura { 0%, 100% { transform: scale(.9); opacity: .85; } 50% { transform: scale(1.15); opacity: 1; } }
  .node:nth-child(odd) .dot::before { animation-delay: -1.4s; }
  .node.on .dot { animation: pop .55s cubic-bezier(.3, 1.8, .5, 1) forwards, twinkle 2.4s ease-in-out .6s infinite; }
  @keyframes pop { to { transform: scale(1); } }
  @keyframes twinkle { 50% { opacity: .65; transform: scale(.85); } }
  .node .label { position: absolute; white-space: nowrap; text-align: center; translate: -50% 0; left: 0; top: 22px; opacity: 0; transform: translateY(6px); transition: opacity .45s ease, transform .45s ease; }
  .node.up .label { top: auto; bottom: 22px; transform: translateY(-6px); }
  .node.on .label { opacity: 1; transform: none; }
  .label b { display: block; color: var(--ink); text-shadow: 0 0 10px rgba(16, 21, 63, .9); font-weight: 600; font-size: clamp(.85rem, 1.5vw, 1.05rem); }
  .label span { display: block; color: var(--teal); font-weight: 500; font-size: clamp(.72rem, 1.2vw, .85rem); }

  .title { position: absolute; left: 0; right: 0; bottom: 10vh; text-align: center; color: var(--ink); opacity: 0; transform: translateY(10px); transition: opacity .6s ease, transform .6s ease; }
  .title.on { opacity: 1; transform: none; }
  .title small { display: block; color: var(--teal); letter-spacing: .14em; text-transform: uppercase; font-size: .8rem; font-weight: 600; margin-bottom: .3rem; }
  .title strong { font-size: clamp(1.6rem, 4vw, 2.6rem); font-weight: 700; text-shadow: 0 0 24px rgba(140, 160, 255, .45); }


  .skip { position: absolute; right: 16px; bottom: 16px; padding: .45rem .9rem; border: 1px solid rgba(255, 255, 255, .25); border-radius: 999px; background: transparent; color: var(--muted); font: 500 .85rem "Fredoka", sans-serif; cursor: pointer; opacity: .75; z-index: 2; }
  .skip:hover { opacity: 1; color: var(--ink); }

  .controls { position: fixed; z-index: 20; right: 16px; top: 16px; }
  .controls button { font: 600 14px/1 "Fredoka", sans-serif; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--yellow); color: #141a4a; cursor: pointer; box-shadow: 0 3px 0 #f2a91f; }
  .tag { position: fixed; z-index: 20; left: 16px; top: 16px; color: var(--muted); font-size: 13px; background: rgba(16, 21, 63, .85); padding: 6px 10px; border-radius: 6px; }
</style>
</head>
<body>
  <iframe id="site" src="https://slen-fullstack.github.io/Stephanie-Coding-Project/work/" title="Work Portfolio"></iframe>

  <div id="intro">
    <canvas id="intro-stars" aria-hidden="true"></canvas>
    <div class="map" id="map">
      <svg class="lines" id="lines" aria-hidden="true"></svg>
    </div>
    <p class="title" id="title"><small>Stephanie Slen</small><strong>A constellation of work</strong></p>
    <button class="skip" id="skip" type="button">Skip intro</button>
  </div>

  <div class="sunrise" id="sunrise" aria-hidden="true"></div>

  <span class="tag">Template preview: not on your site yet</span>
  <div class="controls"><button id="replay" type="button">Replay</button></div>

<script>
(function () {
  // Each star: role, where, year — in the order they happened.
  // pos = [x%, y%] on wide screens | [x%, y%] on phones
  var stars = [
    { role: "Youth Leader", org: "Writers' Exchange · 2020", pos: [9, 62, 22, 14] },
    { role: "Board Director", org: "Britannia · 2022", pos: [22, 34, 72, 23] },
    { role: "Founder", org: "The People's Voice · 2023", pos: [37, 56, 28, 34] },
    { role: "Gala Envoy", org: "Fresh Roots · 2023", pos: [50, 26, 74, 45] },
    { role: "Site Support Worker", org: "Pacific Community Resources · 2024", pos: [62, 60, 26, 56] },
    { role: "Debate Instructor", org: "UBC Recreation · 2024", pos: [75, 36, 72, 66] },
    { role: "Program Facilitator", org: "Writers' Exchange · 2026", pos: [86, 64, 30, 76] },
    { role: "Project Manager", org: "Trout Lake · 2026", pos: [92, 22, 70, 86] }
  ];
  var intro = document.getElementById("intro");
  var map = document.getElementById("map");
  var svg = document.getElementById("lines");
  var title = document.getElementById("title");
  var canvas = document.getElementById("intro-stars");
  var ctx = canvas.getContext("2d");
  var NS = "http://www.w3.org/2000/svg";
  var nodes = [], lines = [], timers = [], dots = [], raf;

  function mobile() { return innerWidth < 700; }

  function build() {
    map.querySelectorAll(".node").forEach(function (n) { n.remove(); });
    svg.innerHTML = ""; nodes = []; lines = [];
    var m = mobile();
    var pts = stars.map(function (s) {
      var x = (m ? s.pos[2] : s.pos[0]) / 100 * innerWidth;
      var y = m ? s.pos[3] / 100 * innerHeight * .82 : (0.06 + s.pos[1] / 100 * 1.05) * innerHeight;
      return [x, y];
    });
    stars.forEach(function (s, i) {
      var n = document.createElement("div");
      n.className = "node";
      // put the label above the star when the line comes from below
      var prevY = i ? pts[i - 1][1] : pts[i][1] + 1, nextY = i < pts.length - 1 ? pts[i + 1][1] : pts[i][1] + 1;
      if (!m && pts[i][1] < prevY && pts[i][1] < nextY) n.classList.add("up");
      n.style.setProperty("--x", pts[i][0] + "px");
      n.style.setProperty("--y", pts[i][1] + "px");
      n.innerHTML = '<span class="dot"></span><span class="label"><b>' + s.role + "</b><span>" + s.org + "</span></span>";
      map.appendChild(n); nodes.push(n);
      if (i) {
        var l = document.createElementNS(NS, "line");
        l.setAttribute("x1", pts[i - 1][0]); l.setAttribute("y1", pts[i - 1][1]);
        l.setAttribute("x2", pts[i][0]); l.setAttribute("y2", pts[i][1]);
        l.style.setProperty("--len", Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]).toFixed(1));
        svg.appendChild(l); lines.push(l);
      }
    });
  }

  function sizeCanvas() {
    var dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dots = [];
    for (var i = 0; i < innerWidth * innerHeight / 4000; i++) dots.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 1.3 + .3, p: Math.random() * 6.3, s: Math.random() * .03 + .01 });
  }
  function drawSky() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    dots.forEach(function (d) { d.p += d.s; ctx.globalAlpha = .3 + .6 * Math.abs(Math.sin(d.p)); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.3); ctx.fill(); });
    ctx.globalAlpha = 1;
    raf = requestAnimationFrame(drawSky);
  }

  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

  function play() {
    timers.forEach(clearTimeout); timers = [];
    intro.classList.remove("done", "leave");
    setP(0, 0);
    title.classList.remove("on");
    build(); sizeCanvas();
    cancelAnimationFrame(raf); drawSky();
    var STEP = 420;
    nodes.forEach(function (n, i) {
      later(function () {
        if (i) lines[i - 1].classList.add("on");
        later(function () { n.classList.add("on"); }, i ? 220 : 0);
      }, 300 + i * STEP);
    });
    var end = 300 + nodes.length * STEP + 250;
    later(function () { title.classList.add("on"); }, end);
    later(sunrise, end + 1300);
  }

  // dawn rises from the bottom and washes the night away
  var sun = document.getElementById("sunrise"), sunRaf;
  function setP(p, g) {
    intro.style.setProperty("--p", p.toFixed(4));
    sun.style.setProperty("--p", p.toFixed(4));
    sun.style.setProperty("--glow", g.toFixed(3));
  }
  function sunrise() {
    intro.classList.add("leave");
    var t0 = performance.now(), DUR = 1900;
    cancelAnimationFrame(sunRaf);
    (function step(now) {
      var k = Math.min((now - t0) / DUR, 1);
      var p = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;   // ease in-out
      var g = k < .12 ? k / .12 : k > .8 ? (1 - k) / .2 : 1;          // fade the glow in and out
      setP(p, g);
      if (k < 1) sunRaf = requestAnimationFrame(step); else finish();
    })(t0);
  }
  function finish() {
    timers.forEach(clearTimeout); cancelAnimationFrame(sunRaf);
    intro.classList.add("done"); setP(1, 0);
    later(function () { cancelAnimationFrame(raf); }, 300);
  }

  document.getElementById("skip").addEventListener("click", finish);
  document.getElementById("replay").addEventListener("click", play);
  play();
})();
</script>
</body>
</html>
