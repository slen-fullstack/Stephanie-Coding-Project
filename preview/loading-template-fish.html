<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rainbow Fish Loader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #10153f;
    --sky-mid: #1b2563;
    --sky-low: #27387f;
    --glow: #3d55b8;
    --ink: #f4f1ff;
    --muted: #c3c6ec;
    --yellow: #ffc94a;
  }
  html, body { margin: 0; height: 100%; background: var(--sky-top); overflow: hidden; font-family: "Fredoka", system-ui, sans-serif; }

  /* The real site sits underneath and is revealed at the end */
  #site { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }

  #loader { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: var(--sky-top); transition: opacity .9s ease, visibility .9s; }
  #loader.done { opacity: 0; visibility: hidden; }

  /* expanding blue core */
  .core {
    position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%;
    background: radial-gradient(circle, #6f86e6 0%, var(--glow) 18%, var(--sky-low) 38%, var(--sky-mid) 62%, var(--sky-top) 100%);
    transform: scale(0); opacity: 0;
  }
  #loader.burst .core { animation: core 1.9s cubic-bezier(.6, 0, .2, 1) forwards; }
  @keyframes core {
    0% { transform: scale(0); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: scale(var(--cover)); opacity: 1; }
  }
  /* soft pulsing glow while waiting */
  .halo { position: absolute; left: 50%; top: 50%; width: 360px; height: 360px; margin: -180px 0 0 -180px; border-radius: 50%; background: radial-gradient(circle, rgba(61, 85, 184, .35), transparent 70%); animation: halo 2.4s ease-in-out infinite; }
  @keyframes halo { 50% { transform: scale(1.12); opacity: .7; } }

  #warp { position: absolute; inset: 0; width: 100%; height: 100%; }

  .stage { position: relative; z-index: 2; text-align: center; transition: transform .7s cubic-bezier(.6, -.3, .4, 1), opacity .5s; }
  #loader.burst .stage { transform: scale(.3); opacity: 0; }
  #critter { width: min(320px, 70vw); height: auto; overflow: visible; }
  .msg { margin: .6rem 0 0; color: var(--muted); font-size: 1.05rem; letter-spacing: .02em; min-height: 1.5em; }
  .msg span { display: inline-block; animation: msgIn .45s ease both; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } }
  .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  /* preview-only controls */
  .controls { position: fixed; z-index: 20; right: 16px; bottom: 16px; display: flex; gap: 8px; }
  .controls button { font: 600 14px/1 "Fredoka", sans-serif; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--yellow); color: #141a4a; cursor: pointer; box-shadow: 0 3px 0 #f2a91f; }
  .tag { position: fixed; z-index: 20; left: 16px; bottom: 16px; color: var(--muted); font-size: 13px; background: rgba(16, 21, 63, .8); padding: 6px 10px; border-radius: 6px; }

  @media (prefers-reduced-motion: reduce) {
    .halo, .dots::after { animation: none; }
  }
</style>
</head>
<body>
  <iframe id="site" src="https://slen-fullstack.github.io/Stephanie-Coding-Project/" title="Stephanie Slen website"></iframe>

  <div id="loader" role="status" aria-live="polite">
    <div class="halo" aria-hidden="true"></div>
    <div class="core" aria-hidden="true"></div>
    <canvas id="warp" aria-hidden="true"></canvas>
    <div class="stage">
      <svg id="critter" viewBox="-135 -135 270 270" aria-hidden="true">
        <defs>
          <linearGradient id="finFill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5cc6f2"/><stop offset=".55" stop-color="#4a8fe0"/><stop offset="1" stop-color="#8a62cf"/>
          </linearGradient>
          <linearGradient id="pecFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#7fdcc4"/><stop offset=".6" stop-color="#5ab8e8"/><stop offset="1" stop-color="#9a7be0"/>
          </linearGradient>
          <radialGradient id="bodyFill" cx="60%" cy="40%" r="70%">
            <stop offset="0" stop-color="#7cc8f2"/><stop offset="1" stop-color="#2f6fc4"/>
          </radialGradient>
          <radialGradient id="headFill" cx="55%" cy="35%" r="75%">
            <stop offset="0" stop-color="#bfe8fb"/><stop offset=".55" stop-color="#7ccaf0"/><stop offset="1" stop-color="#4d9fe0"/>
          </radialGradient>
          <pattern id="sparkle" width="5" height="5" patternUnits="userSpaceOnUse">
            <rect width="5" height="5" fill="#e9eef6"/><circle cx="2.5" cy="2.5" r="1.3" fill="#fff"/><circle cx="0" cy="0" r=".9" fill="#b9c4d6"/>
          </pattern>
          <clipPath id="bodyClip"><path id="bodyPath" d="M-68 0 C -60 -50, 20 -66, 70 -30 C 92 -14, 96 14, 70 32 C 22 64, -60 52, -68 0 Z"/></clipPath>
          <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
          <filter id="glint"><feGaussianBlur stdDeviation="1.2"/></filter>
        </defs>

        <g class="fish">
          <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0; 0 7; 0 0" dur="2.6s" repeatCount="indefinite"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-3 0 0; 3 0 0; -3 0 0" dur="2.6s" repeatCount="indefinite"/>
            <ellipse cx="0" cy="88" rx="80" ry="10" fill="#000" opacity=".25" filter="url(#soft)"/>

            <!-- tail -->
            <g>
              <animateTransform attributeName="transform" type="rotate" values="-13 -64 0; 13 -64 0; -13 -64 0" dur=".7s" repeatCount="indefinite"/>
              <path d="M-62 0 C -88 -12, -108 -48, -124 -64 C -112 -22, -112 22, -124 64 C -108 48, -88 12, -62 0 Z" fill="url(#finFill)" stroke="#2a78c0" stroke-width="2.5" stroke-linejoin="round"/>
              <path d="M-80 -6 L -110 -40 M -82 6 L -110 42 M -88 -1 L -114 -6" stroke="#fff" stroke-width="2" opacity=".55" stroke-linecap="round"/>
            </g>
            <!-- dorsal fin -->
            <g>
              <animateTransform attributeName="transform" type="rotate" values="0 -10 -48; -5 -10 -48; 0 -10 -48" dur="1.3s" repeatCount="indefinite"/>
              <path d="M-36 -46 C -28 -104, 26 -104, 52 -38 Z" fill="url(#finFill)" stroke="#2a78c0" stroke-width="2.5" stroke-linejoin="round"/>
              <path d="M-14 -58 L 0 -86 M 6 -54 L 20 -82 M 24 -48 L 36 -66" stroke="#fff" stroke-width="2" opacity=".55" stroke-linecap="round"/>
            </g>
            <!-- bottom fin -->
            <g>
              <animateTransform attributeName="transform" type="rotate" values="0 14 48; 8 14 48; 0 14 48" dur="1.1s" repeatCount="indefinite"/>
              <path d="M-4 48 C 4 82, 36 90, 44 52 Z" fill="url(#pecFill)" stroke="#2a78c0" stroke-width="2.5" stroke-linejoin="round"/>
            </g>

            <!-- body + scales -->
            <path d="M-68 0 C -60 -50, 20 -66, 70 -30 C 92 -14, 96 14, 70 32 C 22 64, -60 52, -68 0 Z" fill="url(#bodyFill)"/>
            <g id="scales" clip-path="url(#bodyClip)"></g>
            <!-- head -->
            <path d="M38 -46 C 72 -42, 96 -14, 92 6 C 90 26, 72 44, 40 48 C 54 22, 54 -22, 38 -46 Z" fill="url(#headFill)"/>
            <path d="M40 -40 C 52 -14, 52 16, 40 42" fill="none" stroke="#2a78c0" stroke-width="2" opacity=".6"/>
            <path d="M-68 0 C -60 -50, 20 -66, 70 -30 C 92 -14, 96 14, 70 32 C 22 64, -60 52, -68 0 Z" fill="none" stroke="#2a78c0" stroke-width="2.5"/>
            <!-- side fin -->
            <g>
              <animateTransform attributeName="transform" type="rotate" values="0 44 18; 16 44 18; 0 44 18" dur=".9s" repeatCount="indefinite"/>
              <path d="M44 18 C 30 38, 40 56, 60 50 C 58 38, 54 26, 44 18 Z" fill="url(#pecFill)" stroke="#2a78c0" stroke-width="2" stroke-linejoin="round" opacity=".95"/>
            </g>
            <!-- eye -->
            <circle cx="66" cy="-9" r="9" fill="#fff" stroke="#2a78c0" stroke-width="2"/>
            <circle cx="68" cy="-9" r="4.6" fill="#3346a8"/>
            <circle cx="69.5" cy="-11" r="1.6" fill="#fff"/>
            <g>
              <animateTransform attributeName="transform" type="scale" values="1 1; 1 1; 1 .1; 1 1" keyTimes="0; .9; .95; 1" dur="4s" repeatCount="indefinite" additive="sum"/>
            </g>
            <!-- lips -->
            <path d="M86 10 C 92 2, 102 4, 100 10 C 102 16, 92 20, 86 14 Z" fill="#f6c63a" stroke="#d6941b" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M88 12 L 99 11" stroke="#d6941b" stroke-width="1.5" stroke-linecap="round"/>
          </g>
        </g>
        <g id="bubbles"></g>
      </svg>
      <p class="msg"><span id="msgText">Swimming through the stars</span><span class="dots"></span></p>
    </div>
  </div>

  <span class="tag">Template preview: not on your site yet</span>
  <div class="controls"><button id="replay" type="button">Replay</button></div>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ── Build the fish's scales ──
  function make(tag, attrs, parent) {
    var el = document.createElementNS(NS, tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    parent.appendChild(el);
    return el;
  }
  var palette = ["#3fa9e6", "#5d70d8", "#8b5ccc", "#e04f86", "#2fb3a3", "#4cc6f2", "#6f86e6", "#2c7fd0", "#a46ad8"];
  var scaleLayer = document.getElementById("scales");
  var shimmering = [];
  var seed = 7;
  function rand() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  for (var col = 0; col < 7; col++) {
    for (var row = 0; row < 7; row++) {
      var x = 34 - col * 16;
      var y = -54 + row * 18 + (col % 2) * 9;
      var silver = rand() < 0.3;
      var g = make("g", {}, scaleLayer);
      make("path", {
        d: "M" + (x + 4) + " " + (y - 11) + " A 12 12 0 1 0 " + (x + 4) + " " + (y + 11) + " Z",
        fill: silver ? "url(#sparkle)" : palette[Math.floor(rand() * palette.length)],
        stroke: silver ? "#9fb0c8" : "rgba(20,40,110,.35)", "stroke-width": 1.3
      }, g);
      if (silver) {
        var glint = make("path", { d: "M" + (x - 3) + " " + (y - 4) + " l 2 -4 l 2 4 l 4 2 l -4 2 l -2 4 l -2 -4 l -4 -2 Z", fill: "#fff", opacity: 0 }, g);
        shimmering.push({ el: glint, phase: rand() * Math.PI * 2 });
      }
    }
  }

  // ── Bubbles drifting up from the mouth ──
  var bubbleLayer = document.getElementById("bubbles");
  var bubbles = [];
  for (var bI = 0; bI < 7; bI++) {
    bubbles.push({ el: make("circle", { r: 0, fill: "rgba(170,225,255,.25)", stroke: "#bfe8fb", "stroke-width": 1.4 }, bubbleLayer), off: bI / 7, size: 2.5 + rand() * 4 });
  }

  function drawCritter(t) {
    shimmering.forEach(function (s) {
      var v = Math.max(0, Math.sin(t * 2.4 + s.phase));
      s.el.setAttribute("opacity", (Math.pow(v, 6)).toFixed(2));
    });
    bubbles.forEach(function (b) {
      var p = (t * 0.45 + b.off) % 1;
      b.el.setAttribute("cx", (104 + Math.sin(p * 9 + b.off * 6) * 6 + p * 14).toFixed(1));
      b.el.setAttribute("cy", (2 - p * 150).toFixed(1));
      b.el.setAttribute("r", (b.size * (0.4 + p)).toFixed(1));
      b.el.setAttribute("opacity", (p < .1 ? p * 10 : 1 - Math.max(0, p - .7) / .3).toFixed(2));
    });
  }

  // ── Rotating messages ──
  var messages = ["Swimming through the stars", "Polishing every scale", "Gathering the scholarships", "Making a splash", "Almost there"];
  var msgEl = document.getElementById("msgText");
  var msgTimer;
  function cycleMessages() {
    var m = 0;
    clearInterval(msgTimer);
    msgEl.textContent = messages[0];
    msgTimer = setInterval(function () {
      m = (m + 1) % messages.length;
      msgEl.textContent = messages[m];
      msgEl.style.animation = "none"; void msgEl.offsetWidth; msgEl.style.animation = "";
    }, 1100);
  }

  // ── Warp-speed shooting stars ──
  var canvas = document.getElementById("warp");
  var ctx = canvas.getContext("2d");
  var stars = [], warping = false, warpStart = 0;
  function sizeCanvas() {
    var dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // how big the core must grow to cover the screen
    var diag = Math.hypot(innerWidth, innerHeight);
    document.documentElement.style.setProperty("--cover", (diag / 30 * 1.15).toFixed(1));
  }
  function spawnStars() {
    stars = [];
    for (var i = 0; i < 220; i++) {
      stars.push({ a: Math.random() * Math.PI * 2, d: Math.random() * 40, v: 2 + Math.random() * 6, w: Math.random() * 1.8 + .6, hue: Math.random() < .2 ? "255,201,74" : Math.random() < .2 ? "95,227,192" : "255,255,255" });
    }
  }
  function drawWarp(now) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    if (!warping) return;
    var cx = innerWidth / 2, cy = innerHeight / 2;
    var e = Math.min((now - warpStart) / 1600, 1);
    var speed = 1 + e * 9;
    stars.forEach(function (s) {
      var d0 = s.d;
      s.d += s.v * speed;
      var len = Math.min(s.d - d0, 160) * 3;
      var x1 = cx + Math.cos(s.a) * s.d, y1 = cy + Math.sin(s.a) * s.d;
      var x0 = cx + Math.cos(s.a) * Math.max(s.d - len, 0), y0 = cy + Math.sin(s.a) * Math.max(s.d - len, 0);
      var g = ctx.createLinearGradient(x0, y0, x1, y1);
      g.addColorStop(0, "rgba(" + s.hue + ",0)");
      g.addColorStop(1, "rgba(" + s.hue + ",.95)");
      ctx.strokeStyle = g; ctx.lineWidth = s.w;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      if (s.d > Math.hypot(cx, cy) + 50) { s.d = Math.random() * 30; s.a = Math.random() * Math.PI * 2; }
    });
  }

  // ── Timeline ──
  var loader = document.getElementById("loader");
  var t0 = performance.now(), timers = [];
  function loop(now) {
    drawCritter((now - t0) / 1000);
    drawWarp(now);
    requestAnimationFrame(loop);
  }

  function play() {
    timers.forEach(clearTimeout); timers = [];
    loader.classList.remove("burst", "done");
    warping = false;
    cycleMessages();
    // On the real site this waits for the page to finish loading (min ~3s).
    timers.push(setTimeout(function () {
      clearInterval(msgTimer);
      spawnStars(); warping = true; warpStart = performance.now();
      loader.classList.add("burst");
    }, 3600));
    timers.push(setTimeout(function () { loader.classList.add("done"); }, 3600 + 1900));
    timers.push(setTimeout(function () { warping = false; }, 3600 + 2800));
  }

  sizeCanvas();
  addEventListener("resize", sizeCanvas);
  document.getElementById("replay").addEventListener("click", play);
  if (reduce) drawCritter(0); else requestAnimationFrame(loop);
  play();
})();
</script>
</body>
</html>
