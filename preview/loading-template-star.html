<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supernova Loader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #10153f;
    --sky-mid: #1b2563;
    --sky-low: #27387f;
    --glow: #3d55b8;
    --ink: #f4f1ff;
    --muted: #c3c6ec;
    --yellow: #ffc94a;
  }
  html, body { margin: 0; height: 100%; background: var(--sky-top); overflow: hidden; font-family: "Fredoka", system-ui, sans-serif; }

  /* The real site sits underneath and is revealed at the end */
  #site { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }

  #loader { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: var(--sky-top); transition: opacity .9s ease, visibility .9s; }
  #loader.done { opacity: 0; visibility: hidden; }

  /* expanding blue core */
  .core {
    position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%;
    background: radial-gradient(circle, #6f86e6 0%, var(--glow) 18%, var(--sky-low) 38%, var(--sky-mid) 62%, var(--sky-top) 100%);
    transform: scale(0); opacity: 0;
  }
  #loader.burst .core { animation: core 1.9s cubic-bezier(.6, 0, .2, 1) forwards; }
  @keyframes core {
    0% { transform: scale(0); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: scale(var(--cover)); opacity: 1; }
  }
  /* soft pulsing glow while waiting */
  .halo { position: absolute; left: 50%; top: 50%; width: 360px; height: 360px; margin: -180px 0 0 -180px; border-radius: 50%; background: radial-gradient(circle, rgba(61, 85, 184, .35), transparent 70%); animation: halo 2.4s ease-in-out infinite; }
  @keyframes halo { 50% { transform: scale(1.12); opacity: .7; } }

  #warp { position: absolute; inset: 0; width: 100%; height: 100%; }

  .stage { position: relative; z-index: 2; text-align: center; transition: transform .7s cubic-bezier(.6, -.3, .4, 1), opacity .5s; }
  #loader.burst .stage { transform: scale(.3); opacity: 0; }
  #critter { width: min(320px, 70vw); height: auto; overflow: visible; }
  .msg { margin: .6rem 0 0; color: var(--muted); font-size: 1.05rem; letter-spacing: .02em; min-height: 1.5em; }
  .msg span { display: inline-block; animation: msgIn .45s ease both; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } }
  .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }


  /* supernova: implode, then blast */
  #loader.burst .stage { transform: none; opacity: 1; animation: nova .75s cubic-bezier(.5, 0, .2, 1) forwards; }
  @keyframes nova {
    0% { transform: scale(1); opacity: 1; filter: brightness(1); }
    30% { transform: scale(.45); opacity: 1; filter: brightness(1.6); }
    100% { transform: scale(4); opacity: 0; filter: brightness(3); }
  }
  #loader.burst .msg { opacity: 0; transition: opacity .2s; }
  .flash { position: absolute; left: 50%; top: 50%; width: 170vmax; height: 170vmax; translate: -50% -50%; border-radius: 50%; z-index: 3; pointer-events: none; opacity: 0; mix-blend-mode: screen; background: radial-gradient(circle closest-side, #fff 0%, #fff6d6 14%, #ffd86b 30%, rgba(255, 150, 60, .55) 50%, rgba(80, 110, 230, .25) 72%, rgba(80, 110, 230, 0) 100%); }
  #loader.burst .flash { animation: flash .9s ease-out .22s forwards; }
  @keyframes flash { 0% { opacity: 0; transform: scale(.4); } 20% { opacity: 1; } 100% { opacity: 0; transform: scale(1.6); } }
  .shock { position: absolute; left: 50%; top: 50%; width: 0; height: 0; translate: -50% -50%; border-radius: 50%; z-index: 2; border: 3px solid #fff3c4; box-shadow: 0 0 24px #ffd86b, inset 0 0 24px #ffd86b; opacity: 0; }
  #loader.burst .shock { animation: shock 1.1s cubic-bezier(.2, .7, .3, 1) .22s forwards; }
  @keyframes shock { 0% { width: 0; height: 0; opacity: 1; } 100% { width: 240vmax; height: 240vmax; opacity: 0; } }
  #loader.burst .core { animation-delay: .25s; }

  /* preview-only controls */
  .controls { position: fixed; z-index: 20; right: 16px; bottom: 16px; display: flex; gap: 8px; }
  .controls button { font: 600 14px/1 "Fredoka", sans-serif; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--yellow); color: #141a4a; cursor: pointer; box-shadow: 0 3px 0 #f2a91f; }
  .tag { position: fixed; z-index: 20; left: 16px; bottom: 16px; color: var(--muted); font-size: 13px; background: rgba(16, 21, 63, .8); padding: 6px 10px; border-radius: 6px; }

  @media (prefers-reduced-motion: reduce) {
    .halo, .dots::after { animation: none; }
  }
</style>
</head>
<body>
  <iframe id="site" src="https://slen-fullstack.github.io/Stephanie-Coding-Project/" title="Stephanie Slen website"></iframe>

  <div id="loader" role="status" aria-live="polite">
    <div class="halo" aria-hidden="true"></div>
    <div class="core" aria-hidden="true"></div>
    <canvas id="warp" aria-hidden="true"></canvas>
    <div class="shock" aria-hidden="true"></div>
    <div class="flash" aria-hidden="true"></div>
    <div class="stage">
      <svg id="critter" viewBox="-150 -150 300 300" aria-hidden="true">
        <defs>
          <radialGradient id="auraGrad">
            <stop offset="0" stop-color="#fff6c8" stop-opacity=".95"/>
            <stop offset=".25" stop-color="#ffd86b" stop-opacity=".55"/>
            <stop offset=".6" stop-color="#ff9e3d" stop-opacity=".15"/>
            <stop offset="1" stop-color="#ff9e3d" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="starFill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#ffc94a"/><stop offset="1" stop-color="#ff8a4c"/>
          </linearGradient>
          <radialGradient id="coreFill">
            <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
          <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
          <path id="spark" d="M0 -10 C1.5 -2 2 -1.5 10 0 C2 1.5 1.5 2 0 10 C-1.5 2 -2 1.5 -10 0 C-2 -1.5 -1.5 -2 0 -10Z"/>
        </defs>
        <g id="rays" opacity=".5"></g>
        <circle id="aura" r="120" fill="url(#auraGrad)"/>
        <g id="starBody">
          <path d="M0 -62 L16 -20 L60 -18 L26 10 L37 54 L0 30 L-37 54 L-26 10 L-60 -18 L-16 -20Z" fill="#ffe9a8" stroke="#ffe9a8" stroke-width="16" stroke-linejoin="round" filter="url(#blur6)" opacity=".8"/>
          <path d="M0 -62 L16 -20 L60 -18 L26 10 L37 54 L0 30 L-37 54 L-26 10 L-60 -18 L-16 -20Z" fill="url(#starFill)" stroke="#ffe9a8" stroke-width="8" stroke-linejoin="round"/>
          <circle r="22" fill="url(#coreFill)"/>
        </g>
        <g id="sparks"></g>
      </svg>
      <p class="msg"><span id="msgText">Gathering stardust</span><span class="dots"></span></p>
    </div>
  </div>

  <span class="tag">Template preview: not on your site yet</span>
  <div class="controls"><button id="replay" type="button">Replay</button></div>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ── Build the charging star ──
  function make(tag, attrs, parent) {
    var el = document.createElementNS(NS, tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    parent.appendChild(el);
    return el;
  }
  var CHARGE_TIME = 3.6; // seconds before the star bursts (on the real site: until the page has loaded)
  var aura = document.getElementById("aura");
  var starBody = document.getElementById("starBody");
  var rays = document.getElementById("rays");
  for (var r = 0; r < 12; r++) {
    make("path", { d: "M-3 -70 L0 -135 L3 -70Z", fill: "#ffe9a8", transform: "rotate(" + r * 30 + ")" }, rays);
  }
  var sparkLayer = document.getElementById("sparks");
  var colors = ["#ffc94a", "#5fe3c0", "#ff8a4c", "#fff3c4", "#5fe3c0", "#ffc94a", "#ff8a4c"];
  var sparks = colors.map(function (c, i) {
    return { el: make("use", { href: "#spark", fill: c }, sparkLayer), a: i / colors.length * Math.PI * 2, r: 88 + (i % 3) * 14, v: 0.9 + (i % 4) * 0.25, s: 0.7 + (i % 3) * 0.3 };
  });
  var charge = 0;

  function drawCritter(t) {
    charge = Math.min(t / CHARGE_TIME, 1);
    var e = charge * charge;
    var beat = Math.sin(t * (4 + e * 14));                  // pulses faster as it charges
    var scale = 0.85 + e * 0.25 + beat * (0.03 + e * 0.05);
    starBody.setAttribute("transform", "rotate(" + (Math.sin(t * 1.5) * 6).toFixed(2) + ") scale(" + scale.toFixed(3) + ")");
    aura.setAttribute("r", (95 + e * 55 + beat * 8).toFixed(1));
    aura.setAttribute("opacity", (0.55 + e * 0.45).toFixed(2));
    rays.setAttribute("transform", "rotate(" + (t * 12).toFixed(1) + ") scale(" + (0.8 + e * 0.5 + beat * 0.04).toFixed(3) + ")");
    rays.setAttribute("opacity", (0.2 + e * 0.6).toFixed(2));
    sparks.forEach(function (sp) {
      var ang = sp.a + t * sp.v * (1 + e * 2.5);
      var rad = sp.r * (1 - e * 0.35);                      // sparks get pulled in
      var tw = 0.6 + 0.4 * Math.sin(t * 5 + sp.a * 3);
      sp.el.setAttribute("transform", "translate(" + (Math.cos(ang) * rad).toFixed(1) + " " + (Math.sin(ang) * rad).toFixed(1) + ") rotate(" + (t * 90).toFixed(0) + ") scale(" + (sp.s * tw).toFixed(2) + ")");
    });
  }

  // ── Rotating messages ──
  var messages = ["Gathering stardust", "Charging up the stars", "Counting the scholarships", "Lighting up the sky", "Almost there"];
  var msgEl = document.getElementById("msgText");
  var msgTimer;
  function cycleMessages() {
    var m = 0;
    clearInterval(msgTimer);
    msgEl.textContent = messages[0];
    msgTimer = setInterval(function () {
      m = (m + 1) % messages.length;
      msgEl.textContent = messages[m];
      msgEl.style.animation = "none"; void msgEl.offsetWidth; msgEl.style.animation = "";
    }, 1100);
  }

  // ── Warp-speed shooting stars ──
  var canvas = document.getElementById("warp");
  var ctx = canvas.getContext("2d");
  var stars = [], warping = false, warpStart = 0;
  function sizeCanvas() {
    var dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // how big the core must grow to cover the screen
    var diag = Math.hypot(innerWidth, innerHeight);
    document.documentElement.style.setProperty("--cover", (diag / 30 * 1.15).toFixed(1));
  }
  function spawnStars() {
    stars = [];
    for (var i = 0; i < 220; i++) {
      stars.push({ a: Math.random() * Math.PI * 2, d: Math.random() * 40, v: 2 + Math.random() * 6, w: Math.random() * 1.8 + .6, hue: Math.random() < .2 ? "255,201,74" : Math.random() < .2 ? "95,227,192" : "255,255,255" });
    }
  }
  function drawWarp(now) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    if (!warping) return;
    var cx = innerWidth / 2, cy = innerHeight / 2;
    var e = Math.min((now - warpStart) / 1600, 1);
    var speed = 1 + e * 9;
    stars.forEach(function (s) {
      var d0 = s.d;
      s.d += s.v * speed;
      var len = Math.min(s.d - d0, 160) * 3;
      var x1 = cx + Math.cos(s.a) * s.d, y1 = cy + Math.sin(s.a) * s.d;
      var x0 = cx + Math.cos(s.a) * Math.max(s.d - len, 0), y0 = cy + Math.sin(s.a) * Math.max(s.d - len, 0);
      var g = ctx.createLinearGradient(x0, y0, x1, y1);
      g.addColorStop(0, "rgba(" + s.hue + ",0)");
      g.addColorStop(1, "rgba(" + s.hue + ",.95)");
      ctx.strokeStyle = g; ctx.lineWidth = s.w;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      if (s.d > Math.hypot(cx, cy) + 50) { s.d = Math.random() * 30; s.a = Math.random() * Math.PI * 2; }
    });
  }

  // ── Timeline ──
  var loader = document.getElementById("loader");
  var t0 = performance.now(), timers = [];
  function loop(now) {
    drawCritter((now - t0) / 1000);
    drawWarp(now);
    requestAnimationFrame(loop);
  }

  function play() {
    timers.forEach(clearTimeout); timers = [];
    loader.classList.remove("burst", "done");
    t0 = performance.now();
    warping = false;
    cycleMessages();
    // On the real site this waits for the page to finish loading (min ~3s).
    timers.push(setTimeout(function () {
      clearInterval(msgTimer);
      loader.classList.add("burst");
      timers.push(setTimeout(function () { spawnStars(); warping = true; warpStart = performance.now(); }, 230));
    }, 3600));
    timers.push(setTimeout(function () { loader.classList.add("done"); }, 3600 + 1900));
    timers.push(setTimeout(function () { warping = false; }, 3600 + 2800));
  }

  sizeCanvas();
  addEventListener("resize", sizeCanvas);
  document.getElementById("replay").addEventListener("click", play);
  if (reduce) drawCritter(0); else requestAnimationFrame(loop);
  play();
})();
</script>
</body>
</html>
